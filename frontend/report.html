<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo lỗi — Xn</title>
<meta name="description" content="Phát hiện lỗi hoặc gặp vấn đề khi dùng Xn? Gửi báo cáo cho đội ngũ Xn.">
<link rel="canonical" href="https://xomnho.meorap.site/report">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/css/style.css?v=3">
<script>
(function () {
    try {
        var t = localStorage.getItem('xn.theme') || 'system';
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* storage bị chặn */ }
})();
</script>
</head>
<body data-page="report">

<a class="skip-link" href="#main">Tới nội dung chính</a>

<header class="site-header">
    <div class="container inner">
        <a class="brand" href="/" aria-label="Trang chủ Xn">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.5 13.5a4.5 4.5 0 0 0 6.6.4l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4l-1.5 1.5"/>
                    <path d="M13.5 10.5a4.5 4.5 0 0 0-6.6-.4l-2.6 2.6a4.5 4.5 0 0 0 6.4 6.4l1.5-1.5"/>
                </svg>
            </span>
            <span>Xn</span>
        </a>
        <nav class="site-nav" aria-label="Điều hướng chính">
            <a href="/support">Hỗ trợ</a>
            <a href="/team">Đội ngũ</a>
            <a href="/login">Đăng nhập</a>
        </nav>
        <div class="header-actions">
            <button class="icon-btn" type="button" data-theme-toggle></button>
            <a class="btn btn--ghost" href="/support">Trung tâm hỗ trợ</a>
        </div>
    </div>
</header>

<main id="main">
    <div class="page-wrap" style="max-width:720px">
        <h1>Báo lỗi</h1>
        <p class="lead">Phát hiện lỗi hoặc gặp vấn đề? Hãy gửi báo cáo cho đội ngũ Xn —
            chúng tôi phản hồi qua email trong 24 giờ làm việc.</p>

        <section class="report-form-wrap" style="margin-top:28px">
            <form id="bug-form" novalidate>
                <div class="report-grid">
                    <div class="field">
                        <label for="bug-name">Tên / tên đăng nhập</label>
                        <input class="input" type="text" id="bug-name" maxlength="60" placeholder="Ví dụ: minhanh"
                               aria-describedby="bug-name-error">
                        <p class="field-error" id="bug-name-error"></p>
                    </div>
                    <div class="field">
                        <label for="bug-email">Email</label>
                        <input class="input" type="email" id="bug-email" placeholder="ban@example.com"
                               aria-describedby="bug-email-error">
                        <p class="field-error" id="bug-email-error"></p>
                    </div>
                    <div class="field field--full">
                        <label for="bug-type">Loại vấn đề</label>
                        <select class="input" id="bug-type">
                            <option value="bug">Lỗi kỹ thuật</option>
                            <option value="suggestion">Góp ý tính năng</option>
                            <option value="account">Vấn đề tài khoản</option>
                            <option value="other">Khác</option>
                        </select>
                    </div>
                    <div class="field field--full">
                        <label for="bug-desc">Mô tả lỗi</label>
                        <textarea class="textarea" id="bug-desc" maxlength="2000" rows="6"
                                  placeholder="Chuyện gì đã xảy ra? Bạn làm bước nào trước khi gặp lỗi?" aria-describedby="bug-desc-error"></textarea>
                        <p class="field-error" id="bug-desc-error"></p>
                    </div>
                    <div class="field field--full">
                        <label for="bug-url">URL hiện tại <span class="muted" style="font-weight:440">(đã điền sẵn)</span></label>
                        <input class="input" type="text" id="bug-url" spellcheck="false">
                    </div>
                </div>

                <button class="btn btn--primary btn--lg" type="submit" id="bug-submit" data-icon="share" style="margin-top:20px">Gửi báo lỗi</button>
                <p class="form-success" id="bug-success" role="status">
                    <span data-icon="checkCircle" style="display:inline-flex"></span>
                    <span id="bug-success-text"></span>
                </p>
            </form>
        </section>
    </div>
</main>

<footer data-footer></footer>

<script src="/js/main.js?v=3"></script>
<script>
(function () {
    document.addEventListener('DOMContentLoaded', function () {
        var Xn = window.Xn;
        var urlInput = document.getElementById('bug-url');
        urlInput.value = location.href;

        var form = document.getElementById('bug-form');
        var submit = document.getElementById('bug-submit');
        var success = document.getElementById('bug-success');
        var successText = document.getElementById('bug-success-text');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            success.classList.remove('is-visible');

            var name = document.getElementById('bug-name');
            var email = document.getElementById('bug-email');
            var desc = document.getElementById('bug-desc');

            var ok = [
                Xn.setFieldState(name, name.value.trim() ? '' : 'Nhập tên hoặc tên đăng nhập của bạn.'),
                Xn.setFieldState(email, Xn.checkEmail(email.value)),
                Xn.setFieldState(desc, desc.value.trim().length >= 10 ? '' : 'Mô tả chi tiết hơn (ít nhất 10 ký tự) để chúng tôi hỗ trợ nhanh.')
            ].every(Boolean);
            if (!ok) return;

            submit.classList.add('is-loading');
            submit.disabled = true;

            Xn.api.reportBug({
                name: name.value.trim(),
                email: email.value.trim(),
                type: document.getElementById('bug-type').value,
                description: desc.value.trim(),
                url: urlInput.value.trim()
            }).then(function (data) {
                submit.classList.remove('is-loading');
                submit.disabled = false;
                successText.textContent = data.message || 'Đã gửi báo cáo.';
                success.classList.add('is-visible');
                form.reset();
                urlInput.value = location.href;
                Xn.toast('Đã gửi báo cáo. Cảm ơn bạn!');
            }).catch(function (err) {
                submit.classList.remove('is-loading');
                submit.disabled = false;
                if (err.errors) {
                    if (err.errors.name) Xn.setFieldState(name, err.errors.name);
                    if (err.errors.email) Xn.setFieldState(email, err.errors.email);
                    if (err.errors.description) Xn.setFieldState(desc, err.errors.description);
                }
                Xn.toast(err.message, 'error');
            });
        });
    });
})();
</script>
</body>
</html>
