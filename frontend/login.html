<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Xn</title>
<meta name="description" content="Đăng nhập để quản lý trang bio-link của bạn.">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/css/style.css?v=3">
<script>
(function () {
    try {
        var t = localStorage.getItem('xn.theme') || 'system';
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* storage bị chặn */ }
})();
</script>
</head>
<body data-page="login">

<a class="skip-link" href="#main">Tới nội dung chính</a>

<div class="auth">
    <div class="auth-form-side">
        <header>
            <a class="brand" href="/" aria-label="Trang chủ Xn">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.5 13.5a4.5 4.5 0 0 0 6.6.4l2.6-2.6a4.5 4.5 0 0 0-6.4-6.4l-1.5 1.5"/>
                        <path d="M13.5 10.5a4.5 4.5 0 0 0-6.6-.4l-2.6 2.6a4.5 4.5 0 0 0 6.4 6.4l1.5-1.5"/>
                    </svg>
                </span>
                <span>Xn</span>
            </a>
            <div style="display:flex;gap:8px;align-items:center">
                <button class="icon-btn" type="button" data-theme-toggle></button>
                <a class="btn btn--soft btn--sm" href="/register">Tạo tài khoản</a>
            </div>
        </header>

        <main class="auth-body" id="main">
            <h1>Chào bạn trở lại</h1>
            <p>Đăng nhập để chỉnh sửa trang bio-link và xem số liệu của bạn.</p>

            <form class="auth-form" id="login-form" novalidate>
                <div class="form-alert" id="login-alert" role="alert"></div>

                <div class="field">
                    <label for="login-username">Tên đăng nhập</label>
                    <input class="input" type="text" id="login-username" name="username"
                           placeholder="ten-dang-nhap" autocomplete="username"
                           spellcheck="false" required aria-describedby="login-username-error">
                    <p class="field-error" id="login-username-error"></p>
                </div>

                <div class="field field-password">
                    <label for="login-password">Mật khẩu</label>
                    <input class="input" type="password" id="login-password" name="password"
                           placeholder="Mật khẩu của bạn" autocomplete="current-password" required
                           aria-describedby="login-password-error">
                    <button class="reveal" type="button" data-reveal="login-password" aria-label="Hiện mật khẩu" data-icon="eye"></button>
                    <p class="field-error" id="login-password-error"></p>
                </div>

                <button class="btn btn--primary btn--lg btn--block" type="submit" id="login-submit">Đăng nhập</button>
            </form>

            <p class="auth-alt">Mới đến với Xn? <a href="/register">Tạo trang của bạn</a></p>
        </main>
    </div>

    <aside class="auth-aside" aria-label="Ví dụ trang bio-link">
        <div class="auth-aside-copy">
            <h2>Trang của bạn không bao giờ lỗi thời</h2>
            <p>Thay một liên kết một lần và mọi bio bạn từng đăng đều trỏ đến bản mới.</p>
        </div>
        <div class="phone">
            <div class="phone-screen" id="login-preview"></div>
        </div>
    </aside>
</div>

<script src="/js/main.js?v=3"></script>
</body>
</html>
